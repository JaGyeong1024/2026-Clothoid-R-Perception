pitch_deg: 0.73   # 마운트 pitch (bag RANSAC 측정)

roi_x_min: 0.0
roi_x_max: 8.0
roi_y_min: -2.0   # 좌우 대칭. 주행 차선이 바뀌어도 양쪽을 본다
roi_y_max: 2.0    # 〃 (차선 밖 검출은 플래닝이 거른다)
roi_z_min: -2.0
roi_z_max: 1.5
voxel_size: 0.1

dror_min_neighbors: 3
dror_min_radius: 0.1
dror_radius_scale: 0.1
dror_max_radius: 0.2

grid_cell_size: 0.2
grid_max_height_diff: 0.2
grid_min_points: 3    # voxel 0.1/cell 0.2 이면 셀당 최대 4점 — 10은 달성 불가였다
ground_thresh: 0.1

euclidean_min_cluster_size: 5
cluster_merge_gap: 0.5
max_length: 2.5
max_width: 2.5
max_height: 1.8   # ERP·사람 수용
min_length: 0.3   # 라바콘(0.37m) 수용
min_width: 0.3
min_height: 0.3
euclidean_base_dist: 0.1
euclidean_dist_scale: 0.05

cone_max_footprint: 0.5   # 라바콘 규칙: 수평 최대 변
cone_min_height: 0.25
cone_min_aspect: 1.5      # 높이/수평. 지면·풀·박스는 0.32, 콘은 2.9~3.0

tracker_max_miss: 5
tracker_min_hits: 3   # 이 프레임 수 이상 연속 관측된 트랙만 발행
match_dist: 1.5
