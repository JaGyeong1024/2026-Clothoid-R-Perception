# 발행 ROI (센서 좌표). 지면 평면은 이보다 넓은 영역(x ≤ 15 m, |y| ≤ 7 m)에서 맞춘다.
roi_x_min: 0.0
roi_x_max: 8.0
roi_y_min: -3.0   # 좌우 대칭. 주행 차선이 바뀌어도 양쪽을 본다
roi_y_max: 3.0    # 〃 (차선 밖 검출은 플래닝이 거른다)
roi_z_max: 1.5
voxel_size: 0.1

dror_min_neighbors: 3
dror_min_radius: 0.1
dror_radius_scale: 0.1
dror_max_radius: 0.2

# 지면 제거(horizon_ground) 후 점을 XY 고정 간격으로 묶는다
cluster_eps: 0.15         # 콘 벽(콘 간격 ~0.5 m)도 콘 단위로 갈라지는 간격
cluster_min_points: 3
obj_min_height: 0.3       # 지면 평면 위 최고점 높이 (연석·풀 제외)
obj_max_height: 2.0       # ERP·사람 수용
obj_max_footprint: 2.5    # 수평 최대 변

tracker_max_miss: 5
tracker_min_hits: 3   # 이 프레임 수 이상 연속 관측된 트랙만 발행
match_dist: 1.5
