name: clothoid
channels:
  - conda-forge
dependencies:
  # ROS Noetic uses Python 3.8 on Ubuntu 20.04. Match so cv_bridge/rospy
  # from /opt/ros/noetic load without ABI mismatch.
  - python=3.8

  # ROS Python tooling used by catkin wrappers and launch-time imports.
  # rospy/sensor_msgs/cv_bridge still come from the sourced ROS Noetic environment.
  - catkin_pkg
  - empy
  - rospkg
  - pyyaml

  # Perception runtime — kept on conda to avoid pip recompiling BLAS deps.
  - numpy=1.24.*
  - scipy=1.10.*
  - scikit-learn=1.3.*
  - pip

  - pip:
      # PyTorch CUDA 12.1 wheels matching the cnu PC NVIDIA driver.
      - --extra-index-url https://download.pytorch.org/whl/cu121

      # YOLO detection backbone for velodyne_detection (uses ultralytics directly).
      # ultralytics-thop is a hard import inside ultralytics.utils.torch_utils.
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - ultralytics==8.4.51
      - ultralytics-thop==2.0.19

      # OpenCV — pinned to the version validated on the cnu PC.
      # cv_bridge from ROS Noetic links against system OpenCV; cv2 used by
      # node code is this pip wheel. Coexistence works as long as both
      # interpreters (system py3 / clothoid env) are Python 3.8.
      - opencv-python==4.13.0.92

      # OC-SORT runtime deps (the OC_SORT repo itself is cloned to /opt by
      # the Dockerfile and added to sys.path at node start).
      - filterpy==1.4.5
      - lap==0.5.12
